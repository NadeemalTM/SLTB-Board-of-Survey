name: sltb_board_of_survey
description: SLTB Board of Survey - Modern offline-first equipment survey mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Data Import/Export
  csv: ^6.0.0
  
  # File Sharing & Saving (Upgraded to fix Firebase conflict)
  share_plus: ^10.0.0 
  path_provider: ^2.1.1

  # HTTP client
  http: ^1.2.0

  # MySQL
  mysql1: ^0.20.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # Scanning
  mobile_scanner: ^3.5.5

  # Images
  image_picker: ^1.0.5

  # Utilities
  intl: ^0.18.1
  file_picker: ^8.0.0
  permission_handler: ^11.1.0
  connectivity_plus: ^6.1.4

  # UI
  flutter_slidable: ^3.0.1
  cupertino_icons: ^1.0.6
  
  # Firebase
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - lib/img/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/img/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/img/logo.png"